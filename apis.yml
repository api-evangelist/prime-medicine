name: Prime Medicine
description: 'Prime Medicine is a clinical-stage biotechnology company developing a
  new class of differentiated one-time curative genetic therapies built on Prime Editing,
  a versatile, precise, and efficient gene editing technology that can search and replace
  disease-causing genetic sequences at their precise location in the genome without
  causing double-strand DNA breaks. The company is advancing a pipeline of programs
  across a broad range of diseases and, per its public materials, believes Prime Editing
  could theoretically correct approximately 90% of known disease-causing genetic mutations.
  It is publicly traded and surfaced in the API Evangelist network as a portfolio company
  of GV (Google Ventures). This is a corporate/life-sciences profile: the company
  publishes no public developer API, developer portal, or API documentation.'
